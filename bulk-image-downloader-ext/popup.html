<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixGrab</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    html, body { width: 360px; min-height: 480px; max-height: 600px; overflow: hidden; }

    body { display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--md-outline-variant);
      background: var(--md-surface-container-lowest);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon {
      width: 32px; height: 32px;
      background: var(--md-primary-container);
      border-radius: var(--md-radius-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--md-on-primary-container);
    }
    .header-icon .material-icons-round { font-size: 18px !important; }
    .header-title { font-size: 15px; font-weight: 600; color: var(--md-on-surface); }
    .header-actions { display: flex; gap: 4px; }

    /* Tip banner */
    .tip-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 16px 0;
      padding: 10px 12px;
      background: var(--md-primary-container);
      border-radius: var(--md-radius-sm);
      color: var(--md-on-primary-container);
    }
    .tip-banner .material-icons-round { font-size: 18px !important; flex-shrink: 0; }
    .tip-text { font-size: 12px; line-height: 1.4; }

    /* Section heading */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 16px 8px;
    }
    .section-title { font-size: 12px; font-weight: 600; color: var(--md-on-surface-variant); letter-spacing: .06em; text-transform: uppercase; }

    /* Format filter chips */
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 10px;
      flex-shrink: 0;
    }
    .filter-chip { font-family: var(--font); font-size: 11px; padding: 4px 10px; }

    /* Image list */
    .image-list-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: 8px;
    }

    .image-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: var(--md-radius-sm);
      border: 1px solid var(--md-outline-variant);
      background: var(--md-surface-container-lowest);
      cursor: pointer;
      transition: background var(--transition), border-color var(--transition);
      position: relative;
    }
    .image-item:hover { background: var(--md-state-hover); border-color: var(--md-outline); }
    .image-item.selected { border-color: var(--md-primary); background: color-mix(in srgb, var(--md-primary) 8%, transparent); }

    .image-thumb-wrap {
      width: 52px; height: 52px;
      border-radius: var(--md-radius-xs);
      overflow: hidden;
      background: var(--md-surface-variant);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .image-thumb {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
    }
    .image-thumb-placeholder { color: var(--md-outline); }

    .image-info { flex: 1; min-width: 0; }
    .image-name { font-size: 13px; font-weight: 500; color: var(--md-on-surface); }
    .image-meta { font-size: 11px; color: var(--md-on-surface-variant); margin-top: 2px; display: flex; gap: 8px; align-items: center; }
    .image-type-badge {
      font-size: 10px; font-weight: 600; letter-spacing: .04em;
      padding: 1px 5px; border-radius: 3px;
      background: var(--md-secondary-container);
      color: var(--md-on-secondary-container);
    }

    .image-action { display: flex; align-items: center; gap: 4px; }
    .save-btn-single {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--md-primary-container);
      color: var(--md-on-primary-container);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition), transform var(--transition);
      flex-shrink: 0;
    }
    .save-btn-single:hover { background: var(--md-primary); color: var(--md-on-primary); transform: scale(1.05); }
    .save-btn-single:active { transform: scale(.95); }
    .save-btn-single .material-icons-round { font-size: 16px !important; }

    .check-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid var(--md-outline-variant);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: border-color var(--transition), background var(--transition);
    }
    .image-item.selected .check-icon {
      background: var(--md-primary);
      border-color: var(--md-primary);
      color: var(--md-on-primary);
    }
    .check-icon .material-icons-round { font-size: 13px !important; display: none; }
    .image-item.selected .check-icon .material-icons-round { display: flex; }

    /* Empty / loading states */
    .state-empty, .state-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 40px 24px;
      color: var(--md-on-surface-variant);
      text-align: center;
      flex: 1;
    }
    .state-loading .material-icons-round { font-size: 32px !important; animation: spin .8s linear infinite; }
    .state-empty .material-icons-round { font-size: 40px !important; opacity: .4; }
    .state-label { font-size: 13px; }

    /* Skeleton loading rows (shown while scanning the page) */
    .skeleton-item { background: var(--md-surface-container-lowest); }
    .skel-line { border-radius: 4px; }

    /* Footer toolbar */
    .footer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid var(--md-outline-variant);
      gap: 8px;
      flex-shrink: 0;
      background: var(--md-surface-container-lowest);
    }
    .footer-bar.has-selection { display: grid; grid-template-columns: 1fr auto auto; }
    .selection-count { font-size: 13px; color: var(--md-on-surface-variant); align-self: center; }

    /* Skeleton items */
    .skeleton-item {
      display: flex; gap: 10px; padding: 10px;
      border: 1px solid var(--md-outline-variant);
      border-radius: var(--md-radius-sm);
    }
    .skel-thumb { width: 52px; height: 52px; border-radius: var(--md-radius-xs); flex-shrink: 0; }
    .skel-info { flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
    .skel-line { height: 12px; }
    .skel-line-short { width: 60%; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="header-icon">
        <span class="material-icons-round">image</span>
      </div>
      <span class="header-title" id="headerTitle">PixGrab</span>
    </div>
    <div class="header-actions">
      <button class="btn-icon btn" id="btnRescan" title="Rescan page">
        <span class="material-icons-round icon-md">refresh</span>
      </button>
      <button class="btn-icon btn" id="btnSettings" title="Settings">
        <span class="material-icons-round icon-md">settings</span>
      </button>
    </div>
  </header>

  <!-- Tip -->
  <div class="tip-banner fade-in" id="tipBanner">
    <span class="material-icons-round">info</span>
    <span class="tip-text" id="tipText">Right-click any image on any page to save as JPG</span>
  </div>

  <!-- Section header -->
  <div class="section-header" id="sectionHeader" style="display:none">
    <span class="section-title" id="sectionTitle">PAGE IMAGES</span>
    <div style="display:flex; gap:6px;">
      <button class="chip" id="btnSelectAll">
        <span class="material-icons-round icon-sm">check_box</span>
        <span id="selectAllLabel">Select all</span>
      </button>
    </div>
  </div>

  <!-- Format filter chips (only shown when the page has 2+ image types) -->
  <div class="filter-row" id="filterRow" style="display:none"></div>

  <!-- Image list -->
  <div class="image-list-wrap" id="imageListWrap">
    <!-- Skeleton loading -->
    <div id="loadingState" class="state-loading" style="display:none">
      <span class="material-icons-round">autorenew</span>
      <span class="state-label" id="loadingLabel">Scanning images…</span>
    </div>
    <div id="emptyState" class="state-empty" style="display:none">
      <span class="material-icons-round">image_not_supported</span>
      <span class="state-label" id="emptyLabel">No images found on this page</span>
    </div>
    <div id="imageList"></div>
  </div>

  <!-- Footer -->
  <div class="footer-bar" id="footerBar">
    <span class="selection-count" id="selectionCount" style="display:none"></span>
    <button class="btn btn-tonal btn-sm" id="btnSaveSelected" style="display:none">
      <span class="material-icons-round">download</span>
      <span id="btnSaveSelectedLabel">Save selected</span>
    </button>
    <button class="btn btn-filled btn-sm" id="btnSaveAll" style="display:none">
      <span class="material-icons-round">download_for_offline</span>
      <span id="btnSaveAllLabel">Save all</span>
    </button>
  </div>

  <!-- Snackbar -->
  <div class="snackbar" id="snackbar">
    <span class="material-icons-round icon-sm" id="snackbarIcon">check</span>
    <span id="snackbarMsg"></span>
  </div>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
