<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartShot Editor</title>
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/editor.css" />
</head>
<body>
<div class="editor-app" id="editorApp">

  <header class="editor-header">
    <div class="editor-brand">
      <img src="icons/icon32.png" alt="SmartShot" class="editor-brand-icon" />
      <span class="editor-brand-title" data-i18n="editorTitle">SmartShot Editor</span>
    </div>
    <div class="editor-dims" id="editorDims">0 × 0</div>
    <button class="icon-btn" id="closeEditorBtn" data-i18n-title="discard" title="Discard & close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </header>

  <div class="toolbar">
    <div class="tool-group" id="toolGroup">
      <button class="tool-btn active" data-tool="move" data-i18n-title="toolMove" title="Move">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M13 6V3l5 5-5 5V9.5c-3.03.34-4.42 2.19-5 4.5-.63-2.66-2.34-4.5-6-4.5v-2c3.66 0 5.37-1.84 6-4.5.58 2.31 1.97 4.16 5 4.5z"/></svg>
      </button>
      <button class="tool-btn" data-tool="pen" data-i18n-title="toolPen" title="Pen">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      </button>
      <button class="tool-btn" data-tool="arrow" data-i18n-title="toolArrow" title="Arrow">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M3 12l14-9-4 9 4 9z"/></svg>
      </button>
      <button class="tool-btn" data-tool="rect" data-i18n-title="toolRect" title="Rectangle">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h14V7H5z"/></svg>
      </button>
      <button class="tool-btn" data-tool="ellipse" data-i18n-title="toolEllipse" title="Ellipse">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c5.52 0 10 3.13 10 7s-4.48 7-10 7-10-3.13-10-7 4.48-7 10-7zm0 2c-4.42 0-8 2.24-8 5s3.58 5 8 5 8-2.24 8-5-3.58-5-8-5z"/></svg>
      </button>
      <button class="tool-btn" data-tool="text" data-i18n-title="toolText" title="Text">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M5 4v3h5.5v12h3V7H19V4z"/></svg>
      </button>
      <button class="tool-btn" data-tool="highlight" data-i18n-title="toolHighlight" title="Highlight">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 14l3 3-1.5 3H3l3-6zm12.71-9.71a1 1 0 0 0-1.42 0L8 13.59 10.41 16l9.3-9.29a1 1 0 0 0 0-1.42l-1-1z"/></svg>
      </button>
      <button class="tool-btn" data-tool="blur" data-i18n-title="toolBlur" title="Blur / Pixelate">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z" opacity="0.85"/></svg>
      </button>
      <button class="tool-btn" data-tool="crop" data-i18n-title="toolCrop" title="Crop">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 3v4H3v2h4v9a1 1 0 0 0 1 1h9v4h2v-4h4v-2H9V5H7zm4 4h5a1 1 0 0 1 1 1v5h2V8a3 3 0 0 0-3-3h-5v2z"/></svg>
      </button>
    </div>

    <div class="tool-divider"></div>

    <div class="color-group" id="colorGroup">
      <button class="color-swatch active" data-color="#E0522E" style="background:#E0522E"></button>
      <button class="color-swatch" data-color="#E0A22A" style="background:#E0A22A"></button>
      <button class="color-swatch" data-color="#2E9E5B" style="background:#2E9E5B"></button>
      <button class="color-swatch" data-color="#4285F4" style="background:#4285F4"></button>
      <button class="color-swatch" data-color="#111111" style="background:#111111"></button>
      <button class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF; border:1px solid #ccc"></button>
      <input type="color" id="customColor" class="custom-color" value="#E0522E" title="Custom color" />
    </div>

    <div class="tool-divider"></div>

    <div class="size-group">
      <label class="size-label" data-i18n="strokeSize">Size</label>
      <input type="range" min="2" max="30" value="4" id="sizeSlider" class="slider" />
    </div>

    <div class="tool-divider"></div>

    <div class="action-group">
      <button class="icon-btn" id="undoBtn" data-i18n-title="undo" title="Undo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      </button>
      <button class="icon-btn" id="redoBtn" data-i18n-title="redo" title="Redo">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M18.4 10.6C16.55 8.99 14.15 8 11.5 8 6.85 8 2.92 11.03 1.91 15.19l2.37.78C5.33 12.78 8.34 10.5 11.88 10.5c1.96 0 3.73.72 5.12 1.88L13.5 16h9V7l-4.1 3.6z"/></svg>
      </button>
      <button class="icon-btn" id="clearAllBtn" data-i18n-title="clearAll" title="Clear all annotations">
        <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
      </button>
    </div>
  </div>

  <div class="canvas-scroll" id="canvasScroll">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="editorCanvas"></canvas>
      <input type="text" id="textInputOverlay" class="text-input-overlay hidden" />
    </div>
  </div>

  <footer class="editor-footer">
    <div class="footer-left">
      <label class="field-label" data-i18n="format">Format</label>
      <select id="formatSelect" class="select-input">
        <option value="png">PNG</option>
        <option value="jpeg">JPEG</option>
      </select>
      <div class="quality-inline hidden" id="qualityInline">
        <input type="range" min="1" max="100" value="90" id="qualitySlider" class="slider sm" />
        <span id="qualityValue">90%</span>
      </div>
      <input type="text" id="filenameInput" class="text-input" />
    </div>
    <div class="footer-right">
      <button class="btn-secondary" id="copyClipboardBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>
        <span data-i18n="copyClipboard">Copy to Clipboard</span>
      </button>
      <button class="btn-primary" id="downloadBtn" data-i18n="downloadImage">Download</button>
    </div>
  </footer>

  <div class="toast" id="toast"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
