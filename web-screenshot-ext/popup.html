<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SmartShot</title>
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/popup.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon48.png" alt="SmartShot" class="brand-icon" />
      <div class="brand-text">
        <span class="brand-title">SmartShot</span>
        <span class="brand-subtitle" data-i18n="tagline">Screenshot & Annotate</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="langToggleBtn" title="Change language" aria-label="Change language">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.987 7.987 0 0 1 5.08 16zm2.95-8H5.08a7.987 7.987 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
        <span class="lang-code" id="langCode">EN</span>
      </button>
      <button class="icon-btn" id="themeToggleBtn" title="Toggle theme" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 4.5a1 1 0 0 1 1 1V7a1 1 0 1 1-2 0V5.5a1 1 0 0 1 1-1zm0 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm0 2a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V18.5a1 1 0 0 1 1-1zm7.5-6.5a1 1 0 0 1-1 1H17a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1zm-13 0a1 1 0 0 1-1 1H4a1 1 0 0 1 0-2h1.5a1 1 0 0 1 1 1zm11.03-6.03a1 1 0 0 1 0 1.42l-1.06 1.06a1 1 0 1 1-1.42-1.42l1.06-1.06a1 1 0 0 1 1.42 0zM7.55 17.55a1 1 0 0 1 0 1.42l-1.06 1.06a1 1 0 0 1-1.42-1.42l1.06-1.06a1 1 0 0 1 1.42 0zm9.9 1.42a1 1 0 0 1-1.42 0l-1.06-1.06a1 1 0 1 1 1.42-1.42l1.06 1.06a1 1 0 0 1 0 1.42zM6.49 6.49a1 1 0 0 1-1.42 0L4.01 5.43A1 1 0 1 1 5.43 4.01l1.06 1.06a1 1 0 0 1 0 1.42z"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L1.86 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.63-.08.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.4.32.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Capture View ===== -->
  <main class="view" id="view-capture">

    <button class="capture-card" id="captureVisibleBtn">
      <span class="capture-icon">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm1 2v10h14V7H5zm2 2h10v6H7V9z"/></svg>
      </span>
      <span class="capture-text">
        <span class="capture-title" data-i18n="captureVisible">Capture Visible Area</span>
        <span class="capture-sub" data-i18n="captureVisibleSub">Just what's on screen right now</span>
      </span>
    </button>

    <button class="capture-card" id="captureFullPageBtn">
      <span class="capture-icon">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M4 3h12l4 4v14a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm11 1.5V8h3.5L15 4.5zM7 11h10v2H7v-2zm0 4h10v2H7v-2zm0-8h6v2H7V7z"/></svg>
      </span>
      <span class="capture-text">
        <span class="capture-title" data-i18n="captureFullPage">Capture Full Page</span>
        <span class="capture-sub" data-i18n="captureFullPageSub">Scrolls and stitches the entire page</span>
      </span>
    </button>

    <button class="capture-card" id="captureAreaBtn">
      <span class="capture-icon">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7 3H5a2 2 0 0 0-2 2v2h2V5h2V3zm10 0h-2v2h2v2h2V5a2 2 0 0 0-2-2zM5 17v-2H3v2a2 2 0 0 0 2 2h2v-2H5zm14-2v2h-2v2h2a2 2 0 0 0 2-2v-2h-2zM8 8h8v8H8V8z"/></svg>
      </span>
      <span class="capture-text">
        <span class="capture-title" data-i18n="captureArea">Capture Selected Area</span>
        <span class="capture-sub" data-i18n="captureAreaSub">Drag to pick exactly what you need</span>
      </span>
    </button>

    <!-- History -->
    <section class="history-card" id="historyCard">
      <div class="history-header">
        <span data-i18n="history">Recent history</span>
        <button class="text-btn danger" id="clearHistoryBtn" data-i18n="clear">Clear</button>
      </div>
      <ul class="history-list" id="historyList"></ul>
    </section>

    <footer class="app-footer">
      <span data-i18n="madeBy">Made by</span> <strong>gnort67</strong> · <span id="versionLabel">v1.0.0</span>
    </footer>
  </main>

  <!-- ===== Settings View ===== -->
  <div class="view hidden" id="view-settings">
    <div class="settings-header">
      <button class="icon-btn" id="backBtn" aria-label="Back">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </button>
      <h2 data-i18n="settings">Settings</h2>
    </div>

    <section class="settings-section">
      <h3 data-i18n="appearance">Appearance</h3>
      <div class="field-row">
        <label class="field-label" data-i18n="theme">Theme</label>
        <select id="themeSelect" class="select-input">
          <option value="system" data-i18n="themeSystem">System</option>
          <option value="light" data-i18n="themeLight">Light</option>
          <option value="dark" data-i18n="themeDark">Dark</option>
        </select>
      </div>
      <div class="field-row">
        <label class="field-label" data-i18n="fontSize">Font size</label>
        <select id="fontSizeSelect" class="select-input">
          <option value="small" data-i18n="fontSmall">Small</option>
          <option value="medium" data-i18n="fontMedium">Medium</option>
          <option value="large" data-i18n="fontLarge">Large</option>
        </select>
      </div>
      <div class="field-row">
        <label class="field-label" data-i18n="language">Language</label>
        <select id="languageSelect" class="select-input">
          <option value="en">English</option>
          <option value="vi">Tiếng Việt</option>
        </select>
      </div>
    </section>

    <section class="settings-section">
      <h3 data-i18n="displayOptions">Display</h3>
      <label class="switch-item full">
        <input type="checkbox" id="optShowHistory" checked />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="showHistory">Show recent history</span>
      </label>
      <div class="field-row">
        <label class="field-label" data-i18n="historyLimit">History items to keep</label>
        <select id="historyLimitSelect" class="select-input">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="20">20</option>
        </select>
      </div>
    </section>

    <section class="settings-section">
      <h3 data-i18n="captureDefaults">Capture defaults</h3>
      <div class="field-row">
        <label class="field-label" data-i18n="format">Format</label>
        <select id="formatSelect" class="select-input">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
        </select>
      </div>
      <div class="field-row" id="qualityRow">
        <div class="option-row">
          <label class="option-label" data-i18n="quality">JPEG quality</label>
          <span class="option-value" id="qualityValue">90%</span>
        </div>
        <input type="range" min="1" max="100" value="90" id="qualitySlider" class="slider" />
      </div>
      <div class="field-row">
        <div class="option-row">
          <label class="option-label" data-i18n="fullPageDelay">Scroll delay (full page)</label>
          <span class="option-value" id="delayValue">550 ms</span>
        </div>
        <input type="range" min="550" max="2000" step="50" value="550" id="delaySlider" class="slider" />
      </div>
      <label class="switch-item full">
        <input type="checkbox" id="optOpenEditor" />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="openEditorAfterCapture">Open editor after capture</span>
      </label>
      <div class="field-row" id="quickActionRow">
        <label class="field-label" data-i18n="quickSaveAction">If not editing</label>
        <select id="afterCaptureSelect" class="select-input">
          <option value="download" data-i18n="afterDownload">Save to Downloads</option>
          <option value="clipboard" data-i18n="afterClipboard">Copy to clipboard</option>
        </select>
      </div>
    </section>

    <section class="settings-section">
      <h3 data-i18n="dataManagement">Data</h3>
      <div class="settings-btn-row">
        <button class="btn-secondary" id="exportSettingsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          <span data-i18n="exportSettings">Export settings</span>
        </button>
        <button class="btn-secondary" id="importSettingsBtn">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z" transform="rotate(180 12 11)"/></svg>
          <span data-i18n="importSettings">Import settings</span>
        </button>
        <input type="file" id="importSettingsFile" accept="application/json" hidden />
      </div>
      <button class="btn-text-danger" id="resetBtn" data-i18n="resetDefault">Reset to default</button>
    </section>

    <section class="settings-section about-section">
      <h3 data-i18n="about">About</h3>
      <p class="about-text">
        SmartShot · v1.0.0<br/>
        <span data-i18n="authorLine">Developed by</span> <strong>gnort67</strong>
      </p>
    </section>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/main.js"></script>
</body>
</html>
