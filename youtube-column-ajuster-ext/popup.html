<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>YouTube Column Ajuster</title>
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/popup.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ===== Top app bar ===== -->
  <header class="app-header">
    <div class="brand">
      <img src="icons/icon48.png" alt="" class="brand-icon" />
      <div class="brand-text">
        <span class="brand-title">YouTube Column Ajuster</span>
        <span class="brand-subtitle" data-i18n="tagline">Grid layout, your rules</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn m3-ripple" id="langToggleBtn" data-i18n-title="language" data-i18n-aria="language">
        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2s.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A7.987 7.987 0 0 1 5.08 16zm2.95-8H5.08a7.987 7.987 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2s.07-1.35.16-2h4.68c.09.65.16 1.32.16 2s-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2s-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
        <span class="lang-code" id="langCode">EN</span>
      </button>
      <button class="icon-btn m3-ripple" id="themeToggleBtn" data-i18n-title="theme" data-i18n-aria="theme">
        <svg viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M12 4.5a1 1 0 0 1 1 1V7a1 1 0 1 1-2 0V5.5a1 1 0 0 1 1-1zm0 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm0 2a1 1 0 0 1 1 1v1.5a1 1 0 1 1-2 0V18.5a1 1 0 0 1 1-1zm7.5-6.5a1 1 0 0 1-1 1H17a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1zm-13 0a1 1 0 0 1-1 1H4a1 1 0 0 1 0-2h1.5a1 1 0 0 1 1 1zm11.03-6.03a1 1 0 0 1 0 1.42l-1.06 1.06a1 1 0 1 1-1.42-1.42l1.06-1.06a1 1 0 0 1 1.42 0zM7.55 17.55a1 1 0 0 1 0 1.42l-1.06 1.06a1 1 0 0 1-1.42-1.42l1.06-1.06a1 1 0 0 1 1.42 0zm9.9 1.42a1 1 0 0 1-1.42 0l-1.06-1.06a1 1 0 1 1 1.42-1.42l1.06 1.06a1 1 0 0 1 0 1.42zM6.49 6.49a1 1 0 0 1-1.42 0L4.01 5.43A1 1 0 1 1 5.43 4.01l1.06 1.06a1 1 0 0 1 0 1.42z"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Control view ===== -->
  <main class="view" id="view-control">

    <div class="master-switch-card m3-card outlined m3-anim-in">
      <div class="master-switch-row">
        <div class="master-switch-text">
          <span class="control-title" data-i18n="masterSwitch">Enable extension</span>
          <span class="master-switch-hint hidden" id="masterOffHint" data-i18n="masterSwitchOff">All effects are paused</span>
        </div>
        <label class="switch-item">
          <input type="checkbox" id="optEnabled" checked />
          <span class="switch-track"></span>
        </label>
      </div>
    </div>

    <div class="hint-banner m3-anim-in">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
      <span data-i18n="hintBanner">Changes apply instantly on any open YouTube tab, and automatically on future visits.</span>
    </div>

    <section class="control-card m3-card elevated m3-anim-in" id="columnsCard">
      <div class="control-header">
        <span class="control-title" data-i18n="customColumns">Use custom column count</span>
        <label class="switch-item">
          <input type="checkbox" id="optUseCustom" />
          <span class="switch-track"></span>
        </label>
      </div>

      <div id="columnsControl" class="columns-control hidden">
        <div class="columns-value-row">
          <span class="columns-value" id="columnsValue">5</span>
          <span class="columns-value-label" data-i18n="columnsPerRow">columns per row</span>
        </div>
        <div class="m3-slider-wrap">
          <input type="range" min="3" max="8" value="5" id="columnsSlider" class="slider" />
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <p class="default-note" id="defaultNote" data-i18n="defaultNote">Using YouTube's default responsive layout.</p>
    </section>

    <section class="control-card m3-card elevated m3-anim-in">
      <h3 class="section-label" data-i18n="quickToggles">Quick toggles</h3>
      <label class="switch-item full">
        <input type="checkbox" id="optHideShorts" />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="hideShorts">Hide Shorts shelf</span>
      </label>
      <label class="switch-item full">
        <input type="checkbox" id="optCompactCards" />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="compactCards">Compact cards (hide descriptions &amp; avatars)</span>
      </label>
      <label class="switch-item full">
        <input type="checkbox" id="optHideComments" />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="hideComments">Hide comments on watch pages</span>
      </label>
      <label class="switch-item full">
        <input type="checkbox" id="optHideEndCards" />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="hideEndCards">Hide end-screen suggestion cards</span>
      </label>
      <label class="switch-item full">
        <input type="checkbox" id="optFocusMode" />
        <span class="switch-track"></span>
        <span class="switch-text" data-i18n="focusMode">Focus mode (hide related videos sidebar)</span>
      </label>
    </section>

    <div class="popup-link-row m3-anim-in">
      <button class="btn btn-tonal m3-ripple" id="openSettingsBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.62.06-.94s-.02-.64-.07-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L1.86 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.05.3-.08.63-.08.94s.02.64.07.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.4.32.6.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.48 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.01-1.58zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
        <span data-i18n="openSettings">Open full settings</span>
      </button>
      <button class="btn btn-outlined m3-ripple" id="viewLandingBtn">
        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM5 5v14h14v-7h-2v5H7V7h5V5H5z"/></svg>
        <span data-i18n="viewLanding">View landing page</span>
      </button>
    </div>

    <footer class="app-footer">
      <span data-i18n="madeBy">Made by</span> <strong>gnort67</strong> · <span id="versionLabel">v2.0.0</span>
    </footer>
  </main>

  <div class="toast" id="toast"></div>
</div>

<script src="js/i18n.js"></script>
<script src="js/storage.js"></script>
<script src="js/theme.js"></script>
<script src="js/ripple.js"></script>
<script src="js/popup.js"></script>
</body>
</html>
