<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickNote</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">

    <!-- ============================================================
         SIDEBAR — notes list / navigation rail
         ============================================================ -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img class="brand-logo" src="icons/icon48.png" alt="QuickNote" width="26" height="26" />
          <span class="brand-name">QuickNote</span>
        </div>
        <button class="icon-btn md-ripple-host" id="sidebarClose" data-i18n-title="sidebarCloseTooltip" aria-label="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- M3 search field -->
      <div class="search-field">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" />
      </div>

      <!-- M3 filter chips: All / Pinned / Trash -->
      <div class="chip-row" id="viewChips">
        <button class="chip active md-ripple-host" id="chipAll" data-view="active">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span data-i18n="allNotes"></span>
        </button>
        <button class="chip md-ripple-host" id="chipPinned" data-view="pinned">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          <span data-i18n="pinnedNotes"></span>
        </button>
        <button class="chip md-ripple-host" id="chipTrash" data-view="trash">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          <span data-i18n="viewTrash"></span>
        </button>
      </div>

      <!-- Sort control -->
      <div class="sort-row">
        <label class="sort-label" data-i18n="sortLabel" for="sortSelect"></label>
        <select id="sortSelect" class="sort-select">
          <option value="updated" data-i18n="sortUpdated"></option>
          <option value="created" data-i18n="sortCreated"></option>
          <option value="title" data-i18n="sortTitleAz"></option>
        </select>
      </div>

      <div class="notes-list" id="notesList"></div>

      <!-- Trash-only actions -->
      <button class="text-btn danger-text md-ripple-host" id="btnEmptyTrash" style="display:none">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        <span data-i18n="emptyTrashBtn"></span>
      </button>

      <!-- M3 extended FAB — primary action, icon + label -->
      <button class="fab-extended md-ripple-host" id="btnNewNote">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span data-i18n="newNote"></span>
      </button>
    </aside>

    <!-- ============================================================
         MAIN — editor
         ============================================================ -->
    <main class="editor-area">
      <header class="topbar">
        <button class="icon-btn md-ripple-host" id="sidebarOpen" data-i18n-title="sidebarOpenTooltip" aria-label="Open sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="15" y2="18"/></svg>
        </button>

        <div class="topbar-center">
          <span class="save-indicator" id="saveIndicator">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span id="saveLabel" data-i18n="saved"></span>
          </span>
        </div>

        <div class="topbar-actions">
          <button class="icon-btn md-ripple-host" id="btnPin" data-i18n-title="pinTooltip" aria-label="Pin">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V17a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
          </button>

          <button class="icon-btn md-ripple-host" id="btnColor" data-i18n-title="colorTooltip" aria-label="Colour label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.6-4.5-8.4-10-8.4z"/></svg>
          </button>

          <button class="icon-btn md-ripple-host" id="btnDuplicate" data-i18n-title="duplicateTooltip" aria-label="Duplicate">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>

          <button class="icon-btn md-ripple-host" id="btnCopyContent" data-i18n-title="copyContentTooltip" aria-label="Copy content">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
          </button>

          <span class="topbar-divider"></span>

          <button class="icon-btn md-ripple-host" id="btnImportExport" data-i18n-title="importExportTooltip" aria-label="Import / Export">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          </button>

          <button class="icon-btn md-ripple-host" id="btnLanding" data-i18n-title="landingTooltip" aria-label="About QuickNote">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          </button>

          <button class="icon-btn md-ripple-host" id="btnSettings" data-i18n-title="settingsTooltip" aria-label="Settings">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </button>

          <button class="icon-btn danger-icon md-ripple-host" id="btnDelete" data-i18n-title="deleteTooltip" aria-label="Delete">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
          </button>
        </div>
      </header>

      <!-- Colour swatch popover -->
      <div class="popover" id="colorPopover">
        <button class="swatch" data-color="" title="">
          <span class="swatch-dot swatch-none"></span><span data-i18n="colorNone"></span>
        </button>
        <button class="swatch" data-color="red"><span class="swatch-dot" style="background:var(--md-tag-red)"></span><span data-i18n="colorRed"></span></button>
        <button class="swatch" data-color="orange"><span class="swatch-dot" style="background:var(--md-tag-orange)"></span><span data-i18n="colorOrange"></span></button>
        <button class="swatch" data-color="yellow"><span class="swatch-dot" style="background:var(--md-tag-yellow)"></span><span data-i18n="colorYellow"></span></button>
        <button class="swatch" data-color="green"><span class="swatch-dot" style="background:var(--md-tag-green)"></span><span data-i18n="colorGreen"></span></button>
        <button class="swatch" data-color="blue"><span class="swatch-dot" style="background:var(--md-tag-blue)"></span><span data-i18n="colorBlue"></span></button>
        <button class="swatch" data-color="purple"><span class="swatch-dot" style="background:var(--md-tag-purple)"></span><span data-i18n="colorPurple"></span></button>
      </div>

      <div class="editor-body">
        <input type="text" class="note-title-input" id="noteTitleInput" data-i18n-placeholder="titlePlaceholder" maxlength="80" />
        <div class="divider-line"></div>
        <textarea class="note-content-editor" id="noteEditor" spellcheck="false" data-i18n-placeholder="contentPlaceholder"></textarea>
        <div class="word-count" id="wordCount">0</div>
      </div>

      <!-- Empty states -->
      <div class="empty-state" id="emptyState" style="display:none">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <p id="emptyStateTitle" data-i18n="noNotesTitle"></p>
        <p class="empty-state-desc" id="emptyStateDesc" data-i18n="noNotesDesc"></p>
      </div>

      <div class="empty-state" id="trashEmptyState" style="display:none">
        <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        <p data-i18n="trashEmptyTitle"></p>
        <p class="empty-state-desc" data-i18n="trashEmptyDesc"></p>
      </div>

      <!-- Trash item preview panel (shown instead of the editor while viewing Trash) -->
      <div class="trash-preview" id="trashPreview" style="display:none">
        <div class="trash-preview-head">
          <h3 id="trashPreviewTitle"></h3>
          <span class="trash-days" id="trashPreviewDays"></span>
        </div>
        <p class="trash-preview-body" id="trashPreviewBody"></p>
        <div class="trash-preview-actions">
          <button class="filled-tonal-btn md-ripple-host" id="btnRestoreNote">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
            <span data-i18n="restoreNote"></span>
          </button>
          <button class="text-btn danger-text md-ripple-host" id="btnDeleteForever">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            <span data-i18n="deleteForever"></span>
          </button>
        </div>
      </div>
    </main>

    <!-- ============================================================
         MODAL — move to trash confirm
         ============================================================ -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <div class="modal-icon modal-icon-danger">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        </div>
        <h3 data-i18n="deleteTitle"></h3>
        <p data-i18n="deleteDesc"></p>
        <div class="modal-actions">
          <button class="outlined-btn md-ripple-host" id="btnCancelDelete" data-i18n="cancel"></button>
          <button class="filled-btn danger-fill md-ripple-host" id="btnConfirmDelete" data-i18n="delete"></button>
        </div>
      </div>
    </div>

    <!-- MODAL — permanent delete confirm -->
    <div class="modal-overlay" id="foreverModal">
      <div class="modal">
        <div class="modal-icon modal-icon-danger">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </div>
        <h3 data-i18n="deleteForeverTitle"></h3>
        <p data-i18n="deleteForeverDesc"></p>
        <div class="modal-actions">
          <button class="outlined-btn md-ripple-host" id="btnCancelForever" data-i18n="cancel"></button>
          <button class="filled-btn danger-fill md-ripple-host" id="btnConfirmForever" data-i18n="deleteForever"></button>
        </div>
      </div>
    </div>

    <!-- MODAL — empty trash confirm -->
    <div class="modal-overlay" id="emptyTrashModal">
      <div class="modal">
        <div class="modal-icon modal-icon-danger">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
        </div>
        <h3 data-i18n="clearTrashTitle"></h3>
        <p data-i18n="clearTrashDesc"></p>
        <div class="modal-actions">
          <button class="outlined-btn md-ripple-host" id="btnCancelEmptyTrash" data-i18n="cancel"></button>
          <button class="filled-btn danger-fill md-ripple-host" id="btnConfirmEmptyTrash" data-i18n="emptyTrashBtn"></button>
        </div>
      </div>
    </div>

    <!-- ============================================================
         Import / Export panel
         ============================================================ -->
    <div class="popover popover-wide" id="iePanel">
      <div class="popover-label" data-i18n="ieLabelExport"></div>
      <button class="ie-option md-ripple-host" id="ieExportJson">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><span data-i18n="ieExportJson"></span><small data-i18n="ieExportJsonDesc"></small></div>
      </button>
      <button class="ie-option md-ripple-host" id="ieExportCsv">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><span data-i18n="ieExportCsv"></span><small data-i18n="ieExportCsvDesc"></small></div>
      </button>
      <button class="ie-option md-ripple-host" id="ieExportMd">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><span data-i18n="ieExportMd"></span><small data-i18n="ieExportMdDesc"></small></div>
      </button>
      <button class="ie-option md-ripple-host" id="ieExportTxt">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <div><span data-i18n="ieExportTxt"></span><small data-i18n="ieExportTxtDesc"></small></div>
      </button>

      <div class="popover-divider"></div>

      <div class="popover-label" data-i18n="ieLabelImport"></div>
      <button class="ie-option md-ripple-host" id="ieImportJson">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <div><span data-i18n="ieImportJson"></span><small data-i18n="ieImportJsonDesc"></small></div>
      </button>
      <button class="ie-option md-ripple-host" id="ieImportCsv">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <div><span data-i18n="ieImportCsv"></span><small data-i18n="ieImportCsvDesc"></small></div>
      </button>
      <button class="ie-option md-ripple-host" id="ieImportTxt">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <div><span data-i18n="ieImportTxt"></span><small data-i18n="ieImportTxtDesc"></small></div>
      </button>

      <input type="file" id="fileInputJson" accept=".json" style="display:none" />
      <input type="file" id="fileInputCsv" accept=".csv" style="display:none" />
      <input type="file" id="fileInputTxt" accept=".txt,.md" style="display:none" multiple />
    </div>

    <!-- MODAL — import confirm -->
    <div class="modal-overlay" id="importModal">
      <div class="modal">
        <div class="modal-icon modal-icon-success">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </div>
        <h3 data-i18n="importModalTitle"></h3>
        <p><strong id="importCount">0</strong> <span id="importModalDesc"></span></p>
        <div class="import-options">
          <label class="import-radio">
            <input type="radio" name="importMode" value="merge" checked />
            <span data-i18n="importMerge"></span>
          </label>
          <label class="import-radio">
            <input type="radio" name="importMode" value="replace" />
            <span data-i18n="importReplace"></span>
          </label>
        </div>
        <div class="modal-actions">
          <button class="outlined-btn md-ripple-host" id="btnCancelImport" data-i18n="cancel"></button>
          <button class="filled-btn success-fill md-ripple-host" id="btnConfirmImport" data-i18n="importBtn"></button>
        </div>
      </div>
    </div>

    <!-- ============================================================
         M3 Snackbar — replaces the old plain toast; supports an
         optional action button (used for "Undo" after delete).
         ============================================================ -->
    <div class="snackbar" id="snackbar">
      <span class="snackbar-text" id="snackbarText"></span>
      <button class="snackbar-action md-ripple-host" id="snackbarAction"></button>
    </div>

  </div>

  <script src="shared/i18n.js"></script>
  <script src="shared/settings.js"></script>
  <script src="shared/ripple.js"></script>
  <script src="popup.js"></script>
</body>
</html>
