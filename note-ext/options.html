<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cài đặt · QuickNote</title>

  <link rel="icon" href="icons/icon48.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="shared/theme.css" />
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <div class="page">

    <!-- ============================================================
         TOP APP BAR
         ============================================================ -->
    <header class="app-bar">
      <div class="app-bar-brand">
        <img src="icons/icon48.png" width="30" height="30" alt="QuickNote" />
        <div>
          <h1 data-i18n="optionsHeading"></h1>
          <p data-i18n="optionsSubheading"></p>
        </div>
      </div>
      <button class="filled-tonal-btn md-ripple-host" id="btnBackToApp">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span data-i18n="backToApp"></span>
      </button>
    </header>

    <div class="layout">
      <!-- ==========================================================
           SIDE NAV (M3 navigation rail)
           ========================================================== -->
      <nav class="side-nav" id="sideNav">
        <a href="#general" class="nav-item active" data-target="general">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span data-i18n="secGeneral"></span>
        </a>
        <a href="#appearance" class="nav-item" data-target="appearance">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.9 0 1.5-.7 1.5-1.5 0-.4-.2-.8-.4-1.1-.2-.3-.4-.6-.4-1 0-.8.7-1.5 1.5-1.5H16c3.3 0 6-2.7 6-6 0-4.6-4.5-8.4-10-8.4z"/></svg>
          <span data-i18n="secAppearance"></span>
        </a>
        <a href="#editor" class="nav-item" data-target="editor">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span data-i18n="secEditor"></span>
        </a>
        <a href="#data" class="nav-item" data-target="data">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          <span data-i18n="secData"></span>
        </a>
        <a href="#about" class="nav-item" data-target="about">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
          <span data-i18n="secAbout"></span>
        </a>
      </nav>

      <!-- ==========================================================
           CONTENT
           ========================================================== -->
      <main class="content">

        <!-- ---- GENERAL ---- -->
        <section class="card" id="general">
          <h2 data-i18n="secGeneral"></h2>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="languageLabel"></label>
              <p data-i18n="languageDesc"></p>
            </div>
            <div class="segmented" id="langSegmented">
              <button class="segment md-ripple-host" data-value="vi">Tiếng Việt</button>
              <button class="segment md-ripple-host" data-value="en">English</button>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="sidebarDefaultLabel"></label>
              <p data-i18n="sidebarDefaultDesc"></p>
            </div>
            <button class="switch" id="sidebarSwitch" role="switch" aria-checked="true">
              <span class="switch-thumb"></span>
            </button>
          </div>
        </section>

        <!-- ---- APPEARANCE ---- -->
        <section class="card" id="appearance">
          <h2 data-i18n="secAppearance"></h2>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="themeLabel"></label>
              <p data-i18n="themeDesc"></p>
            </div>
            <div class="segmented" id="themeSegmented">
              <button class="segment md-ripple-host" data-value="system">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                <span data-i18n="themeSystem"></span>
              </button>
              <button class="segment md-ripple-host" data-value="light">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
                <span data-i18n="themeLight"></span>
              </button>
              <button class="segment md-ripple-host" data-value="dark">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                <span data-i18n="themeDark"></span>
              </button>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="defaultColorLabel"></label>
              <p data-i18n="defaultColorDesc"></p>
            </div>
            <div class="color-picker" id="defaultColorPicker">
              <button class="color-dot none active" data-color="" data-i18n-title="colorNone"></button>
              <button class="color-dot" data-color="red" style="background:var(--md-tag-red)" data-i18n-title="colorRed"></button>
              <button class="color-dot" data-color="orange" style="background:var(--md-tag-orange)" data-i18n-title="colorOrange"></button>
              <button class="color-dot" data-color="yellow" style="background:var(--md-tag-yellow)" data-i18n-title="colorYellow"></button>
              <button class="color-dot" data-color="green" style="background:var(--md-tag-green)" data-i18n-title="colorGreen"></button>
              <button class="color-dot" data-color="blue" style="background:var(--md-tag-blue)" data-i18n-title="colorBlue"></button>
              <button class="color-dot" data-color="purple" style="background:var(--md-tag-purple)" data-i18n-title="colorPurple"></button>
            </div>
          </div>
        </section>

        <!-- ---- EDITOR ---- -->
        <section class="card" id="editor">
          <h2 data-i18n="secEditor"></h2>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="fontSizeLabel"></label>
              <p data-i18n="fontSizeDesc"></p>
            </div>
            <div class="stepper">
              <button class="icon-btn-sm md-ripple-host" id="btnFontDown" aria-label="-">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="stepper-value" id="fontSizeValue">14px</span>
              <button class="icon-btn-sm md-ripple-host" id="btnFontUp" aria-label="+">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="autosaveLabel"></label>
              <p data-i18n="autosaveDesc"></p>
            </div>
            <div class="stepper">
              <button class="icon-btn-sm md-ripple-host" id="btnAutosaveDown" aria-label="-">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="stepper-value" id="autosaveValue">600ms</span>
              <button class="icon-btn-sm md-ripple-host" id="btnAutosaveUp" aria-label="+">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>

          <div class="editor-preview">
            <div class="editor-preview-title" data-i18n="titlePlaceholder"></div>
            <div class="editor-preview-body" id="editorPreviewBody">QuickNote giúp bạn ghi lại ý tưởng ngay lập tức, với phông chữ Be Vietnam Pro dễ đọc cho cả tiếng Việt lẫn tiếng Anh.</div>
          </div>
        </section>

        <!-- ---- DATA ---- -->
        <section class="card" id="data">
          <h2 data-i18n="secData"></h2>
          <p class="section-desc" data-i18n="dataSectionDesc"></p>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="exportNotesTitle"></label>
              <p data-i18n="exportNotesDesc"></p>
            </div>
            <button class="outlined-btn md-ripple-host" id="btnExportNotes">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              <span data-i18n="exportNotesBtn"></span>
            </button>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="importNotesTitle"></label>
              <p data-i18n="importNotesDesc"></p>
            </div>
            <button class="outlined-btn md-ripple-host" id="btnImportNotes">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span data-i18n="importNotesBtn"></span>
            </button>
            <input type="file" id="fileImportNotes" accept=".json" style="display:none" />
          </div>

          <div class="section-divider"></div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="exportSettingsTitle"></label>
              <p data-i18n="exportSettingsDesc"></p>
            </div>
            <button class="outlined-btn md-ripple-host" id="btnExportSettings">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span data-i18n="exportSettingsBtn"></span>
            </button>
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="importSettingsTitle"></label>
              <p data-i18n="importSettingsDesc"></p>
            </div>
            <button class="outlined-btn md-ripple-host" id="btnImportSettings">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span data-i18n="importSettingsBtn"></span>
            </button>
            <input type="file" id="fileImportSettings" accept=".json" style="display:none" />
          </div>

          <div class="setting-row">
            <div class="setting-info">
              <label data-i18n="resetSettingsTitle"></label>
              <p data-i18n="resetSettingsDesc"></p>
            </div>
            <button class="text-btn md-ripple-host" id="btnResetSettings">
              <span data-i18n="resetSettingsBtn"></span>
            </button>
          </div>

          <div class="danger-zone">
            <h3 data-i18n="dangerZoneTitle"></h3>
            <p data-i18n="dangerZoneDesc"></p>

            <div class="setting-row">
              <div class="setting-info">
                <label data-i18n="clearTrashTitle"></label>
                <p data-i18n="clearTrashDesc"></p>
              </div>
              <button class="outlined-btn danger-outline md-ripple-host" id="btnClearTrash">
                <span data-i18n="clearTrashBtn"></span>
              </button>
            </div>

            <div class="setting-row">
              <div class="setting-info">
                <label data-i18n="clearAllTitle"></label>
                <p data-i18n="clearAllDesc"></p>
              </div>
              <button class="filled-btn danger-fill" id="btnClearAll">
                <span data-i18n="clearAllBtn"></span>
              </button>
            </div>
          </div>
        </section>

        <!-- ---- ABOUT ---- -->
        <section class="card" id="about">
          <h2 data-i18n="secAbout"></h2>

          <div class="about-hero">
            <img src="icons/icon128.png" width="64" height="64" alt="QuickNote" />
            <div>
              <h3>QuickNote</h3>
              <p data-i18n="aboutDesc"></p>
            </div>
          </div>

          <dl class="about-meta">
            <div><dt data-i18n="aboutVersionLabel"></dt><dd id="aboutVersion">2.0.0</dd></div>
            <div><dt data-i18n="aboutAuthorLabel"></dt><dd data-i18n="aboutAuthorValue"></dd></div>
            <div><dt data-i18n="aboutLicense"></dt><dd>MIT License</dd></div>
          </dl>

          <div class="about-actions">
            <button class="filled-btn" id="btnViewLanding">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
              <span data-i18n="viewLandingBtn"></span>
            </button>
          </div>

          <div class="shortcuts">
            <h3 data-i18n="shortcutsTitle"></h3>
            <div class="shortcut-row"><span data-i18n="shortcutNewNote"></span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>N</kbd></div>
            <div class="shortcut-row"><span data-i18n="shortcutCopy"></span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd></div>
            <div class="shortcut-row"><span data-i18n="shortcutSearch"></span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd></div>
            <div class="shortcut-row"><span data-i18n="shortcutPin"></span><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>P</kbd></div>
            <div class="shortcut-row"><span data-i18n="shortcutClose"></span><kbd>Esc</kbd></div>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- Confirm dialogs (reset settings / clear trash / clear all) -->
  <div class="modal-overlay" id="resetModal">
    <div class="modal">
      <h3 data-i18n="resetConfirmTitle"></h3>
      <p data-i18n="resetConfirmDesc"></p>
      <div class="modal-actions">
        <button class="outlined-btn md-ripple-host" id="btnCancelReset" data-i18n="cancel"></button>
        <button class="filled-btn md-ripple-host" id="btnConfirmReset" data-i18n="resetConfirmBtn"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="clearTrashModal">
    <div class="modal">
      <h3 data-i18n="clearTrashTitle"></h3>
      <p data-i18n="clearTrashDesc"></p>
      <div class="modal-actions">
        <button class="outlined-btn md-ripple-host" id="btnCancelClearTrash" data-i18n="cancel"></button>
        <button class="filled-btn danger-fill md-ripple-host" id="btnConfirmClearTrash" data-i18n="clearTrashBtn"></button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="clearAllModal">
    <div class="modal">
      <h3 data-i18n="clearAllConfirmTitle"></h3>
      <p data-i18n="clearAllConfirmDesc"></p>
      <div class="modal-actions">
        <button class="outlined-btn md-ripple-host" id="btnCancelClearAll" data-i18n="cancel"></button>
        <button class="filled-btn danger-fill md-ripple-host" id="btnConfirmClearAll" data-i18n="clearAllBtn"></button>
      </div>
    </div>
  </div>

  <div class="snackbar" id="snackbar">
    <span class="snackbar-text" id="snackbarText"></span>
  </div>

  <script src="shared/i18n.js"></script>
  <script src="shared/settings.js"></script>
  <script src="shared/ripple.js"></script>
  <script src="options.js"></script>
</body>
</html>
